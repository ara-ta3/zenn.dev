name: textlint

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: pnpm/action-setup@v6.1.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26
        check-latest: true
        cache: "pnpm"
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
    - run: make install
    - run: make lint

